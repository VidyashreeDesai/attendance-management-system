<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Management System - Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <h1>Attendance Management System</h1>
    <p class="subtitle">Sign in to manage your classroom</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required />
      </div>
      <div id="errorMsg" class="error-msg hidden"></div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="hint">Default credentials: <strong>admin</strong> / <strong>admin123</strong></p>
    <p class="auth-switch">New administrator? <a href="/register.html">Create an account</a></p>
    <p class="auth-switch"><a href="/">← Back to Home</a></p>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
