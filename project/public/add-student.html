<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Student - Attendance Management System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Attendance MS</div>
    <ul class="nav-links" id="navLinks">
      <li><a href="/dashboard.html">Dashboard</a></li>
      <li><a href="/add-student.html" class="active">Add Student</a></li>
      <li><a href="/students.html">View Students</a></li>
      <li><a href="/attendance.html">Mark Attendance</a></li>
      <li><a href="/records.html">Records</a></li>
      <li><a href="/report.html">Reports</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
  </nav>

  <main class="page-container">
    <h1 class="page-title">Add Student</h1>
    <div class="form-card">
      <form id="studentForm">
        <div class="form-row">
          <div class="form-group">
            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" placeholder="e.g. S006" required />
          </div>
          <div class="form-group">
            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Full name" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="student@example.com" required />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Phone number" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="course">Course</label>
            <select id="course" required>
              <option value="">Select course</option>
              <option value="CSE">CSE</option>
              <option value="ISE">ISE</option>
              <option value="ECE">ECE</option>
              <option value="ME">ME</option>
              <option value="CE">CE</option>
            </select>
          </div>
          <div class="form-group">
            <label for="semester">Semester</label>
            <select id="semester" required>
              <option value="">Select semester</option>
              <option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4">4</option>
              <option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option>
            </select>
          </div>
        </div>
        <div id="msgBox" class="msg-box hidden"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Student</button>
          <button type="reset" class="btn btn-secondary">Clear</button>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/students.js"></script>
</body>
</html>
